name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment to release"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Bump version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          old_version="$(nix eval --raw .#packages.x86_64-linux.default.version)"
          npm version "${{ inputs.increment }}" --no-git-tag-version
          new_version="$(nix eval --raw .#packages.x86_64-linux.default.version)"

          tag="v$new_version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Release tag '$tag' already exists." >&2
            exit 1
          fi

          {
            echo "old_version=$old_version"
            echo "version=$new_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail

          asset="zetel-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz"
          tar -C result -czf "$asset" .
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Commit release version
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${{ steps.version.outputs.tag }}" "$ASSET" \
            --target "${{ steps.version.outputs.tag }}" \
            --title "zetel ${{ steps.version.outputs.tag }}" \
            --notes "Release ${{ steps.version.outputs.tag }}" \
            $prerelease_flag
